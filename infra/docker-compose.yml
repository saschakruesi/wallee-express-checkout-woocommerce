# Staging shop. Run on the instance with:
#   docker compose --env-file /opt/wallee-ec/.env -f infra/docker-compose.yml up -d
# Secrets come from /opt/wallee-ec/.env (generated by aws/instance-env.sh).
name: wallee-ec

x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?}
  WORDPRESS_DB_NAME: wordpress
  SHOP_URL: ${SHOP_URL:?}
  # Evaluated by the image's wp-config.php on every request (hence $$ for compose).
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', getenv('SHOP_URL'));
    define('WP_SITEURL', getenv('SHOP_URL'));
    if (isset($$_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO']) && 'https' === $$_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO']) {
        $$_SERVER['HTTPS'] = 'on';
    }

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      <<: *wp-environment
      ORIGIN_SECRET: ${ORIGIN_SECRET:?}
    volumes:
      - wp_data:/var/www/html
      - ../plugin/wallee-express-checkout:/var/www/html/wp-content/plugins/wallee-express-checkout
      - ./wordpress/origin-secret.conf:/etc/apache2/conf-enabled/origin-secret.conf:ro

  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-environment
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
    volumes:
      - wp_data:/var/www/html
      - ../plugin/wallee-express-checkout:/var/www/html/wp-content/plugins/wallee-express-checkout
      - ./wordpress:/seed:ro

volumes:
  db_data:
  wp_data:
